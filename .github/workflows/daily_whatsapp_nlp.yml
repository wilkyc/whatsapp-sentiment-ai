name: Daily WhatsApp Data NLP Pipeline

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: '手動指定日期 (格式: yymmdd，例如 260921；若留空則自動跑昨天全天)'
        required: false
        default: ''
  repository_dispatch:
    types: [trigger-nlp-pipeline]

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Google Service Account Key
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "Error: GitHub Secret GCP_SA_KEY is empty!"
            exit 1
          fi
          echo "$GCP_SA_KEY" > service_account.json
          echo "Service account json created successfully."

      - name: Run NLP Pipeline
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POE_API_KEY: ${{ secrets.POE_API_KEY }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          KEYWORDS_SHEET_URL: ${{ secrets.KEYWORDS_SHEET_URL }}
          GROUPINFO_SHEET_URL: ${{ secrets.GROUPINFO_SHEET_URL }}
          TEST_TARGET_SHEET_URL: ${{ secrets.TEST_TARGET_SHEET_URL }}
          INTERNAL_PHONES_JSON: ${{ secrets.INTERNAL_PHONES_JSON }}
          PYTHONUNBUFFERED: "1"
          MANUAL_DATE: ${{ github.event.inputs.target_date }}
        run: |
          python main.py

      - name: Cleanup Credentials
        if: always()
        run: |
          rm -f service_account.json
          echo "Cleaned temporary credentials."
