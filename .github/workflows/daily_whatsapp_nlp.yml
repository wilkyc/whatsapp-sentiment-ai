name: WhatsApp Data NLP Pipeline

on:
  # 只支援手動觸發 (workflow_dispatch)：在 GitHub 網頁 Actions 頁面點擊 Run workflow
  workflow_dispatch:
    inputs:
      target_date:
        description: '手動重跑參數 (留空=跑最近 65 分鐘增量; 單日=260928 或 2026-09-28; 跨日範圍=2026-07-01 to 2026-09-30; 精確時段=260928 14:00-16:00)'
        required: false
        default: ''
      target_group_ids:
        description: '指定 Group ID 清單 (留空=全部群組; 多個 ID 以逗號分隔)'
        required: false
        default: ''

# 💡 並發保護：若上一個任務因處理量大仍在運行，新觸發的任務會自動排隊等待，絕不並行同時寫入！
concurrency:
  group: hourly-whatsapp-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 檢出專案代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 配置 Python 3.11 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 載入 Google 服務帳號金鑰
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "❌ 錯誤: GitHub Secret [GCP_SA_KEY] 為空，請在 Repository Settings 中設定！"
            exit 1
          fi
          echo "$GCP_SA_KEY" > service_account.json
          echo "✅ 成功建立 service_account.json"

      - name: 執行 WhatsApp 數據清洗與 AI 語義識別 (main.py)
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SOURCE_VIEW: ${{ secrets.SOURCE_VIEW }}
          POE_API_KEY: ${{ secrets.POE_API_KEY }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          KEYWORDS_SPREADSHEET_ID: ${{ secrets.KEYWORDS_SPREADSHEET_ID }}
          KEYWORDS_SHEET_URL: ${{ secrets.KEYWORDS_SHEET_URL }}
          BRAND_SHEET_NAME: ${{ secrets.BRAND_SHEET_NAME }}
          IFT_SHEET_NAME: ${{ secrets.IFT_SHEET_NAME }}
          GROUPINFO_SHEET_URL: ${{ secrets.GROUPINFO_SHEET_URL }}
          TEST_TARGET_SHEET_URL: ${{ secrets.TEST_TARGET_SHEET_URL }}
          INTERNAL_PHONES_JSON: ${{ secrets.INTERNAL_PHONES_JSON }}
          PYTHONUNBUFFERED: "1"
          # 接收手動觸發表單輸入的日期/時段參數
          MANUAL_DATE: ${{ github.event.inputs.target_date }}
          # 指定群組過濾 (留空=處理所有群組)
          TARGET_GROUP_IDS: ${{ github.event.inputs.target_group_ids }}
        run: |
          python main.py

      - name: 清理敏感憑證檔案
        if: always()
        run: |
          rm -f service_account.json
          echo "🧹 已清理臨時憑證"
